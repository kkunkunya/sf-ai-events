<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI &amp; Tech Events Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:980px;margin:0 auto;padding:20px;color:#111}
h1{margin:0 0 4px}.sub{color:#666;margin-bottom:12px}
.tabs button{border:1px solid #ccc;background:#fff;border-radius:16px;padding:4px 12px;margin:0 6px 6px 0;cursor:pointer}
.tabs button.on{background:#111;color:#fff}.tabs{margin-bottom:6px}
#map{height:420px;border-radius:8px;margin:8px 0 12px}
.ev{border-top:1px solid #eee;padding:12px 0}.ev a{font-weight:600;color:#0a58ca;text-decoration:none}
.m{color:#555;font-size:14px}.tag{font-size:12px;background:#eef;border-radius:8px;padding:1px 8px;margin-left:6px}
.pin{cursor:pointer;font-size:13px;color:#888;margin-left:6px}
</style></head><body>
<h1>AI &amp; Tech Events</h1>
<div class="sub">Upcoming AI &amp; tech events by city. Updated daily. <span id="n"></span></div>
<div class="tabs" id="cities"></div><div class="tabs" id="tabs"></div>
<div id="map"></div><div id="list"></div>
<script>
const CITIES={"San Francisco Bay Area":["旧金山 SF",[37.6,-122.2],9],"New York":["纽约 NYC",[40.73,-73.98],11],"London":["伦敦 London",[51.51,-0.12],11],
"Singapore":["新加坡 Singapore",[1.32,103.84],11],"Tokyo":["东京 Tokyo",[35.68,139.73],11],"Beijing":["北京 Beijing",[39.95,116.40],10],
"Shanghai":["上海 Shanghai",[31.22,121.47],10],"Guangzhou":["广州 Guangzhou",[23.13,113.30],10],"Shenzhen":["深圳 Shenzhen",[22.55,114.00],10]};
let all=[],cat="AI",city=new URLSearchParams(location.search).get("city")||"San Francisco Bay Area",marks={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const map=L.map("map");L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
const card=e=>`<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><span class="tag">${esc(e.category||"Other")}</span>
<div class="m">${esc(e.start.replace("T"," "))} · ${esc(e.location)}</div>`;
function setCity(c){city=c;cat="AI";history.replaceState(0,"","?city="+encodeURIComponent(c));map.setView(CITIES[c][1],CITIES[c][2]);render()}
function render(){
  cities.innerHTML=Object.entries(CITIES).map(([k,v])=>`<button class="${k==city?"on":""}" data-c="${k}">${v[0]} (${all.filter(e=>e.city==k).length})</button>`).join("");
  const here=all.filter(e=>e.city==city);
  const cats=["AI","All",...new Set(here.map(e=>e.category).filter(c=>c&&c!="AI"))];
  tabs.innerHTML=cats.map(c=>`<button class="${c==cat?"on":""}" data-t="${esc(c)}">${esc(c)}</button>`).join("");
  const l=here.filter(e=>cat=="All"||e.category==cat);
  n.textContent=l.length+" events";
  layer.clearLayers();marks={};
  l.forEach((e,i)=>{marks[i]=L.marker([e.lat,e.lng]).bindPopup(card(e)+`<div><a href="${esc(e.url)}" target="_blank" rel="noopener">报名 / Register →</a></div>`).addTo(layer)});
  list.innerHTML=l.map((e,i)=>`<div class="ev">${card(e)}<span class="pin" data-i="${i}">📍 on map</span></div>`).join("")||"No events yet.";
}
document.onclick=ev=>{const d=ev.target.dataset;
  if(d.c)setCity(d.c);else if(d.t){cat=d.t;render()}
  else if(d.i){const m=marks[d.i];map.setView(m.getLatLng(),14);m.openPopup();window.scrollTo({top:map.getContainer().offsetTop-10,behavior:"smooth"})}};
fetch("events.json").then(r=>r.json()).then(d=>{all=d;setCity(CITIES[city]?city:"San Francisco Bay Area")});
</script></body></html>
