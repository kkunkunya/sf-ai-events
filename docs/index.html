<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 活动清单</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#111}
h1{margin:0 0 4px;font-size:24px}.sub{color:#666;margin-bottom:12px;font-size:14px}
.tabs button{border:1px solid #ccc;background:#fff;border-radius:16px;padding:4px 12px;margin:0 6px 6px 0;cursor:pointer}
.tabs button.on{background:#111;color:#fff}
.ev{border-top:1px solid #eee;padding:10px 0}.t{font-weight:600}
.m{color:#555;font-size:14px}.ev a{color:#0a58ca}
.free{color:#0a7d32;font-weight:600}.warn{color:#b45309}
</style></head><body>
<h1>AI 活动清单</h1>
<div class="sub">旧金山 / 北京 / 上海 · 每天 07:00 更新 · <span id="n"></span></div>
<div class="tabs" id="tabs"></div><div id="list"></div>
<script>
const CITIES={"San Francisco Bay Area":"旧金山","Beijing":"北京","Shanghai":"上海"};
let all=[],city=new URLSearchParams(location.search).get("city");if(!CITIES[city])city="San Francisco Bay Area";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  tabs.innerHTML=Object.entries(CITIES).map(([k,v])=>`<button class="${k==city?"on":""}" data-c="${k}">${v} (${all.filter(e=>e.city==k).length})</button>`).join("");
  const l=all.filter(e=>e.city==city);
  n.textContent=l.length+" 场";
  list.innerHTML=l.map(e=>`<div class="ev"><div class="t">${esc(e.title)}</div>
  <div class="m">${esc(e.start.replace("T"," "))} · ${esc(e.site)} · <span class="${/^free|免费/i.test(e.price)?"free":""}">${/^free/i.test(e.price)?"免费":e.price=="Unknown"?"价格未知":esc(e.price)}</span></div>
  <div class="m"><a href="${esc(e.url)}" target="_blank" rel="noopener">报名链接</a>${e.link=="unsure"?' <span class="warn">（网站拦截了自动检查，未确认能打开）</span>':""}</div></div>`).join("")||"暂无活动";
}
tabs.onclick=ev=>{const c=ev.target.dataset.c;if(c){city=c;history.replaceState(0,"","?city="+encodeURIComponent(c));render()}};
fetch("events.json").then(r=>r.json()).then(d=>{all=d;render()});
</script></body></html>
