<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bay Area AI &amp; Tech Events</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:20px;color:#111}
h1{margin:0 0 4px}.sub{color:#666;margin-bottom:16px}
.tabs button{border:1px solid #ccc;background:#fff;border-radius:16px;padding:4px 12px;margin:0 6px 6px 0;cursor:pointer}
.tabs button.on{background:#111;color:#fff}
.ev{border-top:1px solid #eee;padding:12px 0}.ev a{font-weight:600;color:#0a58ca;text-decoration:none}
.m{color:#555;font-size:14px}.tag{font-size:12px;background:#eef;border-radius:8px;padding:1px 8px;margin-left:6px}
</style></head><body>
<h1>Bay Area AI &amp; Tech Events</h1>
<div class="sub">Upcoming events in the San Francisco Bay Area. Updated daily. <span id="n"></span></div>
<div class="tabs" id="tabs"></div><div id="list"></div>
<script>
let all=[],cat="AI";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const cats=["AI","All",...new Set(all.map(e=>e.category).filter(c=>c&&c!="AI"))];
  tabs.innerHTML=cats.map(c=>`<button class="${c==cat?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("");
  const l=all.filter(e=>cat=="All"||e.category==cat);
  n.textContent=l.length+" events";
  list.innerHTML=l.map(e=>`<div class="ev"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><span class="tag">${esc(e.category||"Other")}</span>
  <div class="m">${esc(e.start.replace("T"," "))} · ${esc(e.location||"")}</div></div>`).join("")||"No events yet.";
}
fetch("events.json").then(r=>r.json()).then(d=>{all=d;render()});
</script></body></html>
